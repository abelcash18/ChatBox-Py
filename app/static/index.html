<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATS Chatbot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23667eea'>🤖</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #2d3748;
      min-height: 100vh;
      padding: 16px;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
    }

    header {
      text-align: center;
      padding: 24px 0 16px;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 500;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .input-section {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 120px;
      resize: vertical;
      padding: 12px 16px;
      border-radius: 12px;
      background: #f7fafc;
      color: #2d3748;
      border: 2px solid #e2e8f0;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea::placeholder {
      color: #a0aec0;
    }

    button {
      padding: 12px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .messages {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }

    .msg {
      padding: 14px 16px;
      border-radius: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-left: 32px;
      border-radius: 16px 4px 16px 16px;
    }

    .msg.assistant {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      margin-right: 32px;
      border-radius: 4px 16px 16px 16px;
    }

    .meta {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    .msg.user .meta {
      opacity: 0.9;
    }

    .reply {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .retrieved {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      font-size: 12px;
    }

    .retrieved-title {
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    .retrieved pre {
      background: rgba(0, 0, 0, 0.02);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      overflow: auto;
      font-size: 11px;
      line-height: 1.4;
    }

    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a0aec0;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #667eea;
      animation: pulse 1.4s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 640px) {
      .wrap {
        height: auto;
      }

      header h1 {
        font-size: 24px;
      }

      .card {
        border-radius: 16px;
        padding: 16px;
      }

      .input-section {
        flex-direction: column;
      }

      .input-wrapper {
        width: 100%;
      }

      button {
        width: 100%;
      }

      .msg.user {
        margin-left: 0;
      }

      .msg.assistant {
        margin-right: 0;
      }
    }
  </link>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🤖 ATS Chatbot</h1>
      <p>Your AI Assistant</p>
    </header>

    <div class="card">
      <div class="input-section">
        <div class="input-wrapper">
          <label class="input-label" for="message">Message</label>
          <textarea id="message" placeholder="Ask something... (e.g., What is this project?)"></textarea>
        </div>
        <button id="send">Send</button>
      </div>

      <div class="messages" id="messages"></div>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById('send');
    const messageEl = document.getElementById('message');
    const messagesEl = document.getElementById('messages');

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = role === 'You' ? 'msg user' : 'msg assistant';
      div.innerHTML = `
        <div class="meta">${role}</div>
        <div class="reply"></div>
      `;
      div.querySelector('.reply').textContent = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addRetrievedBlock(retrieved) {
      const lastMsg = messagesEl.lastElementChild;
      const block = document.createElement('div');
      block.className = 'retrieved';

      if (!retrieved || !retrieved.length) {
        block.innerHTML = '<div class="retrieved-title">No retrieved context</div>';
      } else {
        const pretty = retrieved.map(r => `• Score: ${r.score}\n  Source: ${r.source}\n  ${r.text.substring(0, 150)}${r.text.length > 150 ? '...' : ''}`).join('\n\n');
        block.innerHTML = `<div class="retrieved-title">📚 Retrieved Context</div><pre>${pretty}</pre>`;
      }
      lastMsg.appendChild(block);
    }

    async function send() {
      const msg = messageEl.value.trim();
      if (!msg) return;

      addMessage('You', msg);
      messageEl.value = '';

      sendBtn.disabled = true;
      const placeholder = document.createElement('div');
      placeholder.className = 'msg assistant';
      placeholder.innerHTML = `
        <div class="meta">Assistant</div>
        <div class="reply">
          <div class="thinking">
            <span>Thinking</span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      `;
      messagesEl.appendChild(placeholder);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch('http://127.0.0.1:8000/api/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message: msg})
        });
        const data = await res.json();
        placeholder.querySelector('.reply').textContent = data.reply || '';
        addRetrievedBlock(data.retrieved);
      } catch (e) {
        placeholder.querySelector('.reply').textContent = '❌ Request failed. Please try again.';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', send);
    messageEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
